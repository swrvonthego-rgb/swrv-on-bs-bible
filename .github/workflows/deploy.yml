name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler globally
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770

      # Pushes API keys from GitHub repo secrets onto the Worker so /api/tts
      # (ElevenLabs voice) and /api/groq work. Add the keys once under
      # Settings → Secrets and variables → Actions; any secret left unset is
      # skipped so the deploy never fails on a missing key.
      - name: Sync Worker secrets
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "$ELEVENLABS_API_KEY" | wrangler secret put ELEVENLABS_API_KEY
          else
            echo "ELEVENLABS_API_KEY not set in GitHub secrets - skipping"
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "$GROQ_API_KEY" | wrangler secret put GROQ_API_KEY
          else
            echo "GROQ_API_KEY not set in GitHub secrets - skipping"
          fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "$SUPABASE_SERVICE_ROLE_KEY" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          else
            echo "SUPABASE_SERVICE_ROLE_KEY not set in GitHub secrets - skipping (in-app account deletion needs it)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
