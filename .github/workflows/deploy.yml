name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler globally
        run: npm install -g wrangler@latest

      # Applies schema.sql to the D1 database on every deploy. Every statement
      # in schema.sql is CREATE TABLE/INDEX IF NOT EXISTS, so this is safe to
      # run on every push — it's a no-op once tables already exist. Skipped
      # automatically until the d1_databases binding block is added back into
      # wrangler.jsonc with a real database_id (see the comment there) — that
      # binding is deliberately absent for now, because wrangler deploy
      # validates it at deploy time and refuses to publish anything at all if
      # it's a placeholder.
      - name: Apply D1 schema
        # continue-on-error: this step must NEVER be able to block the actual
        # Worker deploy below it, no matter what goes wrong here. (Run #36
        # learned this the hard way: the naive grep matched the literal text
        # "d1_databases" inside this file's own explanatory comment, so it
        # tried to run schema against a database that doesn't exist yet, that
        # failed, and the whole job aborted before wrangler deploy ever ran.)
        continue-on-error: true
        run: |
          if grep -v '^\s*//' wrangler.jsonc | grep -q '"d1_databases"'; then
            wrangler d1 execute swrv-bible-db --remote --file=schema.sql
          else
            echo "D1 database not provisioned yet (no active d1_databases binding in wrangler.jsonc) - skipping schema apply"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770

      # Book of Jubilees is served from R2 (see worker.js's /data/jubilees.js
      # route), not bundled as a static asset (see .assetsignore). git stays
      # the source of truth — this step just re-uploads it to R2 whenever it
      # changes, so a content edit to data/jubilees.js takes effect the same
      # way any other data file's does: push to main, done.
      - name: Sync library data to R2
        # --remote is required: without it, this wrangler version silently
        # writes to a throwaway LOCAL simulation instead of the real bucket
        # ("Resource location: local... Upload complete." with nothing
        # actually reaching Cloudflare) — caught in the very first run of
        # this step via the job logs.
        run: wrangler r2 object put swrv-bible-library/jubilees.js --file=data/jubilees.js --content-type=application/javascript --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770

      # Builds the BSB audio manifest (book -> chapter -> real R2 key) that
      # the app's player reads, and validates every book/chapter against the
      # standard canon while doing it — see tools/build-audio-manifest.mjs.
      # Supersedes the standalone inventory script (same validation, plus the
      # manifest); kept as a separate script for standalone debugging.
      # continue-on-error: true so a listing hiccup can never fail a real
      # deploy — the app already treats a missing/stale manifest as "audio
      # not available yet" rather than crashing (see worker.js).
      - name: Build + validate BSB audio manifest
        id: audio_manifest
        continue-on-error: true
        run: node tools/build-audio-manifest.mjs

      - name: Sync BSB audio manifest to R2
        if: steps.audio_manifest.outcome == 'success'
        run: wrangler r2 object put swrv-bible-library/bsb-audio-manifest.json --file=bsb-audio-manifest.json --content-type=application/json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770

      # Reads the published per-verse timings back out of R2 and counts them
      # against the canon. A green align job is not proof of coverage —
      # align-book.mjs keeps partial books on purpose — so this is the only
      # thing that can actually answer "is the whole Bible aligned?".
      # continue-on-error: reporting coverage must never fail a deploy.
      - name: Verify per-verse timing coverage
        continue-on-error: true
        run: node tools/verify-timings.mjs

      # Finds Bible words that already have a dictionary entry but wouldn't
      # get underlined in a given verse (usually an inflected form like
      # "loved" vs. the dictionary's "love") — see tools/audit-dictionary-coverage.mjs.
      # continue-on-error: informational only, must never fail a deploy.
      - name: Audit dictionary-underline coverage
        continue-on-error: true
        run: node tools/audit-dictionary-coverage.mjs

      # Pushes API keys from GitHub repo secrets onto the Worker. Add each key
      # once under Settings → Secrets and variables → Actions; any secret left
      # unset is skipped so the deploy never fails on a missing key, and the
      # matching feature just responds "not configured yet" until it's added.
      - name: Sync Worker secrets
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "$GROQ_API_KEY" | wrangler secret put GROQ_API_KEY
          else
            echo "GROQ_API_KEY not set in GitHub secrets - skipping"
          fi
          if [ -n "$SESSION_SECRET" ]; then
            echo "$SESSION_SECRET" | wrangler secret put SESSION_SECRET
          else
            echo "SESSION_SECRET not set in GitHub secrets - skipping (sign-in/sessions need it)"
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "$GOOGLE_CLIENT_ID" | wrangler secret put GOOGLE_CLIENT_ID
          else
            echo "GOOGLE_CLIENT_ID not set in GitHub secrets - skipping (Google sign-in needs it)"
          fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "$GOOGLE_CLIENT_SECRET" | wrangler secret put GOOGLE_CLIENT_SECRET
          else
            echo "GOOGLE_CLIENT_SECRET not set in GitHub secrets - skipping (Google sign-in needs it)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa970c9a0eed2fcc60ca2d31773f6770
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
